name: Release

# Push a tag like v0.1.0 to build the installer and publish it as a GitHub release.
# Installed copies of the app pick the new release up through Velopack's auto-update.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write   # to create the release and upload Setup.exe and the update packages

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test steamposters/steamposters.sln -c Release

      - name: Pack and publish
        shell: pwsh
        run: ./build/Pack.ps1 -Version ("${{ github.ref_name }}".TrimStart('v')) -GitHubToken "${{ secrets.GITHUB_TOKEN }}" -Upload
